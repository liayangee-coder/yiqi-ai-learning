<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d97569">
  <meta name="description" content="依起愛學習｜依依老師的教學工具箱。">
  <link rel="icon" type="image/png" href="assets/emily-bookmark-transparent.png?v=transparent-v1">
  <title>依起愛學習</title>
  <style>
    :root{--ink:#202947;--muted:#6f7892;--navy:#162142;--paper:#f5f7fc;--line:#e5e9f2;--white:#fff;--blue:#7299ff;--pink:#ff9db3;--yellow:#ffd76f;--green:#80d7bd;--shadow:0 14px 38px rgba(35,49,91,.09)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
    .hero{background:radial-gradient(circle at 86% 18%,rgba(255,215,111,.22),transparent 20%),radial-gradient(circle at 12% 90%,rgba(128,215,189,.18),transparent 24%),linear-gradient(135deg,#162142,#283c72);color:white;padding:30px max(22px,calc((100vw - 1160px)/2)) 56px;position:relative;overflow:hidden}
    .topline{display:flex;justify-content:space-between;align-items:center;gap:16px;max-width:1160px;margin:auto}.brand{display:flex;align-items:center;gap:12px;font-size:14px;letter-spacing:.08em;color:#dce5ff}.brandmark{display:grid;place-items:center;width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#ffd76f,#ff9db3);color:#26325b;font-size:22px;box-shadow:0 7px 22px #080f2d55}.grade{border:1px solid #ffffff35;background:#ffffff12;border-radius:999px;padding:8px 13px;color:#eef2ff;font-size:13px;white-space:nowrap}
    .intro{max-width:1160px;margin:54px auto 0;position:relative}.eyebrow{font-size:13px;letter-spacing:.16em;color:#c2d2ff;font-weight:700}.intro h1{font-size:clamp(36px,6vw,64px);letter-spacing:.02em;margin:12px 0 10px;line-height:1.12}.intro p{font-size:16px;line-height:1.8;color:#dce4ff;margin:0;max-width:610px}.spark{position:absolute;right:8%;top:8px;font-size:clamp(72px,12vw,132px);color:#ffd76f;opacity:.88;transform:rotate(12deg);filter:drop-shadow(0 8px 16px #080f2d55)}
    main{max-width:1160px;margin:-27px auto 0;padding:0 22px 44px;position:relative}.panel{background:var(--white);border:1px solid #edf0f6;border-radius:22px;padding:22px;box-shadow:var(--shadow)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{appearance:none;border:1px solid var(--line);background:#fff;color:#57617d;border-radius:13px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer;transition:.18s}.tab:hover{border-color:#a8baff;color:#324b9b}.tab[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:white;box-shadow:0 5px 14px #16214230}.tab .num{display:inline-grid;place-items:center;min-width:22px;height:22px;margin-left:6px;padding:0 5px;border-radius:99px;background:#ffffff24;font-size:11px}.tab:not([aria-pressed="true"]) .num{background:#f0f2f8;color:#7a8299}
    .search{position:relative;flex:0 1 300px;min-width:220px}.search input{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 15px 12px 42px;font:inherit;color:var(--ink);outline:none;background:#fbfcff}.search input:focus{border-color:#8aa5ff;box-shadow:0 0 0 4px #7898ff20}.search svg{position:absolute;left:14px;top:13px;color:#8992aa}.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 2px 18px;color:var(--muted);font-size:13px}.summary strong{color:var(--ink)}.notice{color:#8a6a22;background:#fff8df;border:1px solid #f3e5aa;border-radius:10px;padding:6px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{display:flex;flex-direction:column;min-height:176px;border:1px solid var(--line);border-radius:17px;padding:17px;background:linear-gradient(160deg,#fff,#fcfdff);transition:transform .18s,box-shadow .18s,border-color .18s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 25px #26365c12;border-color:#cbd5f3}.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.unit{font-size:11px;font-weight:800;letter-spacing:.08em;color:#707b99;background:#f0f3fa;border-radius:99px;padding:5px 9px}.card h2{font-size:16px;line-height:1.55;margin:15px 0 14px;font-weight:750}.card-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.open{display:inline-flex;align-items:center;gap:7px;color:#405ec1;text-decoration:none;font-weight:750;font-size:13px}.open:hover{text-decoration:underline}.subject-dot{width:10px;height:10px;border-radius:50%;background:var(--blue)}.subject-dot.國語{background:var(--pink)}.subject-dot.數學{background:var(--blue)}.subject-dot.社會{background:var(--green)}.unavailable{color:#9b7830;font-size:12px;line-height:1.55}.empty{grid-column:1/-1;text-align:center;padding:52px 15px;color:var(--muted)}.footer{text-align:center;padding:24px 10px 10px;color:#858da3;font-size:12px}.footer strong{color:#596582;font-weight:650}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.spark{right:5%;opacity:.38}.intro{margin-top:40px}}
    @media(max-width:560px){.hero{padding-top:20px;padding-bottom:48px}.grade{font-size:11px}.brand{font-size:12px}.intro p{font-size:14px}.spark{right:0;top:18px;font-size:74px;opacity:.25}main{padding:0 13px 30px}.panel{padding:14px;border-radius:18px}.toolbar{align-items:stretch}.tabs{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tab{padding:9px 4px;font-size:13px}.tab .num{margin-left:3px}.search{flex:auto;min-width:0}.summary{align-items:flex-start;flex-direction:column;margin:18px 2px 14px}.grid{grid-template-columns:1fr;gap:10px}.card{min-height:142px;padding:15px}.card h2{margin:11px 0}.intro h1{font-size:42px}}
    :root{--ink:#513a39;--muted:#89716f;--navy:#d97569;--paper:#fff1ec;--line:#f0dfd8;--white:#fffdfa;--blue:#82b8d4;--pink:#ee978b;--yellow:#f4cc8c;--green:#83bba2;--shadow:0 14px 38px rgba(125,75,67,.10)}
    body{background:var(--paper)}
    .hero{background:radial-gradient(circle at 86% 18%,rgba(246,176,153,.37),transparent 20%),radial-gradient(circle at 12% 90%,rgba(238,151,139,.24),transparent 24%),linear-gradient(135deg,#fff8f3,#ffded4);color:var(--ink)}
    .brand{color:#8e564f}.brandmark{background:linear-gradient(145deg,#f3b7a7,#f8d9c8);color:#6b4845;box-shadow:0 7px 22px #9d625130}.grade{border-color:#efc9be;background:#ffffffa6;color:#845751}
    .eyebrow{color:#c67568}.intro p{color:#765c58}.spark{color:#ec9d8f;filter:drop-shadow(0 8px 16px #a86f6044)}
    .tab{color:#7d6662}.tab:hover{border-color:#efa99a;color:#ae5e56}.tab[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);box-shadow:0 5px 14px #bd6e6230}.tab:not([aria-pressed="true"]) .num{background:#fff0eb;color:#947571}
    .search input{background:#fffdfa}.search input:focus{border-color:#e99788;box-shadow:0 0 0 4px #e9978825}.search svg{color:#9b817c}
    .card{background:linear-gradient(160deg,#fffdfa,#fff9f6)}.card:hover{box-shadow:0 12px 25px #a86f6018;border-color:#f1c8bb}.unit{color:#9b6259;background:#fff0eb}.open{color:#c36359}.footer{color:#927e79}.footer strong{color:#765853}
      .brandmark{width:46px;height:60px;flex:0 0 46px;border-radius:0;background:none;box-shadow:none;overflow:visible}.brandmark img{display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom}
    @media(max-width:560px){.brandmark{width:38px;height:50px;flex-basis:38px}}</style>
</head>
<body>
  <header class="hero">
    <div class="topline">
      <div class="brand"><span class="brandmark" aria-hidden="true"><img src="assets/emily-wave.png" alt=""></span><span>EMILY AI STUDIO</span></div>
    </div>
    <div class="intro">
      <h1>依起愛學習</h1>
      <p>把課堂上的好工具收在一起，選一科、找一課，讓每一次練習都更有趣。</p>
      <span class="spark" aria-hidden="true">✳</span>
    </div>
  </header>
  <main>
    <section class="panel" aria-label="教學工具列表">
      <div class="toolbar">
        <div class="tabs" role="group" aria-label="依科目篩選">
          <button class="tab" data-subject="全部" aria-pressed="true">全部<span class="num" id="count-all">0</span></button>
          <button class="tab" data-subject="國語" aria-pressed="false">國語<span class="num" id="count-國語">0</span></button>
          <button class="tab" data-subject="數學" aria-pressed="false">數學<span class="num" id="count-數學">0</span></button>
          <button class="tab" data-subject="社會" aria-pressed="false">社會<span class="num" id="count-社會">0</span></button>
        </div>
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.3 4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="搜尋課名或關鍵字" aria-label="搜尋教學工具">
        </label>
      </div>
      <div class="summary"><span id="result-text">正在載入教學工具…</span><span class="notice" id="local-note" hidden></span></div>
      <div class="grid" id="cards" aria-live="polite"></div>
    </section>
    <footer class="footer">設計 by 楊依依老師｜Emily AI Studio</footer>
  </main>
  <script>
    const state={items:[],subject:'全部',query:''};
    const $=s=>document.querySelector(s);
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(){
      const shown=state.items.filter(x=>(state.subject==='全部'||x.subject===state.subject)&&(`${x.title} ${x.subject}`).toLowerCase().includes(state.query.toLowerCase()));
      $('#result-text').innerHTML=`共 <strong>${shown.length}</strong> 個項目`;
      const local=state.items.filter(x=>!x.available).length;
      const note=$('#local-note');note.hidden=!local;note.textContent=local?`${local} 筆書籤是本機檔案，原始檔未隨書籤匯出`:'';
      $('#cards').innerHTML=shown.length?shown.map(x=>`<article class="card"><div class="card-top"><span class="unit">${escapeHtml(x.subject)}</span><span class="subject-dot ${escapeHtml(x.subject)}" aria-hidden="true"></span></div><h2>${escapeHtml(x.title)}</h2><div class="card-bottom">${x.available?`<a class="open" href="${escapeHtml(x.url)}" target="_blank" rel="noopener noreferrer">開啟網頁 <span aria-hidden="true">↗</span></a>`:`<span class="unavailable">本機檔案缺少原始 HTML，暫無法開啟</span>`}</div></article>`).join(''):'<div class="empty">找不到符合條件的工具，試試其他關鍵字。</div>';
    }
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{state.subject=button.dataset.subject;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',String(x===button)));render()}));
    $('#search').addEventListener('input',event=>{state.query=event.target.value.trim();render()});
    fetch('./resources.json?v=2aa246c').then(response=>{if(!response.ok)throw new Error('resources');return response.json()}).then(items=>{state.items=items;for(const subject of ['國語','數學','社會'])$(`#count-${subject}`).textContent=items.filter(x=>x.subject===subject).length;$('#count-all').textContent=items.length;render()}).catch(()=>{$('#result-text').textContent='工具清單載入失敗，請確認 resources.json 與 index.html 位於同一資料夾。';$('#cards').innerHTML='<div class="empty">目前無法載入清單。</div>'});
  </script>
</body>
</html>
