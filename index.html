<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff1ec">
  <meta name="description" content="依起愛學習｜依依老師的教學、班級經營與生活小工具箱。">
  <link rel="icon" type="image/png" href="assets/emily-bookmark-transparent.png?v=transparent-v1">
  <title>依起愛學習</title>
  <style>
    :root{--ink:#513a39;--muted:#89716f;--accent:#d97569;--accent-dark:#b85d53;--paper:#fff1ec;--line:#f0dfd8;--white:#fffdfa;--blue:#82b8d4;--pink:#ee978b;--yellow:#f4cc8c;--green:#83bba2;--shadow:0 14px 38px rgba(125,75,67,.10)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
    .hero{background:radial-gradient(circle at 86% 18%,rgba(246,176,153,.37),transparent 20%),radial-gradient(circle at 12% 90%,rgba(238,151,139,.24),transparent 24%),linear-gradient(135deg,#fff8f3,#ffded4);padding:26px max(22px,calc((100vw - 1160px)/2)) 58px;position:relative;overflow:hidden}
    .topline{display:flex;align-items:center;gap:14px;max-width:1160px;margin:auto}.brandmark{display:block;width:48px;height:60px;flex:0 0 48px;object-fit:contain;object-position:center bottom}.brand{font-size:14px;letter-spacing:.08em;color:#8e564f;font-weight:700}
    .intro{max-width:1160px;margin:40px auto 0;position:relative}.eyebrow{font-size:13px;letter-spacing:.13em;color:#c67568;font-weight:800}.intro h1{font-size:clamp(38px,6vw,64px);letter-spacing:.02em;margin:11px 0 10px;line-height:1.12}.intro p{font-size:16px;line-height:1.8;color:#765c58;margin:0;max-width:660px}.spark{position:absolute;right:8%;top:8px;font-size:clamp(72px,12vw,132px);color:#ec9d8f;opacity:.78;transform:rotate(12deg);filter:drop-shadow(0 8px 16px #a86f6044)}
    main{max-width:1160px;margin:-28px auto 0;padding:0 22px 44px;position:relative}.panel{background:var(--white);border:1px solid #f5e7e1;border-radius:24px;padding:24px;box-shadow:var(--shadow)}
    .section-heading{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:0 2px 16px}.section-heading h2{font-size:21px;margin:4px 0 0}.section-heading p{margin:0;color:var(--muted);font-size:13px}.kicker{color:#c67568!important;font-size:12px!important;font-weight:800;letter-spacing:.12em}
    .category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.category-card{appearance:none;display:flex;align-items:center;gap:11px;text-align:left;min-height:78px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:#fffdfa;color:var(--ink);font:inherit;cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s}.category-card:hover{transform:translateY(-2px);border-color:#e9b7aa;box-shadow:0 8px 20px #a86f6012}.category-card[aria-pressed="true"]{border-color:#dc8a7d;background:#fff4ef;box-shadow:0 0 0 2px #dc8a7d20}.category-icon{width:40px;height:40px;flex:0 0 40px;border-radius:13px;display:grid;place-items:center;background:#fff0eb;font-size:20px}.category-copy{min-width:0;display:flex;flex-direction:column;gap:4px}.category-name{font-size:14px;font-weight:800;line-height:1.35}.category-note{font-size:11px;color:var(--muted);line-height:1.35}.category-count{margin-left:auto;align-self:flex-start;min-width:24px;padding:4px 7px;border-radius:99px;background:#fff0eb;color:#956e67;text-align:center;font-size:11px;font-weight:800}
    .subject-panel{margin-top:22px;padding-top:18px;border-top:1px solid #f3e7e1}.subject-heading{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}.subject-heading h3{font-size:14px;margin:0}.subject-heading span{color:var(--muted);font-size:12px}.subject-list{display:flex;gap:8px;flex-wrap:wrap}.subject-button{appearance:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fffdfa;color:#7d6662;font:inherit;font-size:13px;font-weight:750;cursor:pointer}.subject-button:hover{border-color:#efa99a;color:#ae5e56}.subject-button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}.subject-count{font-size:11px;opacity:.8}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:22px}.toolbar-title{font-size:16px;font-weight:800}.search{position:relative;flex:0 1 320px;min-width:220px}.search input{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 15px 12px 42px;font:inherit;color:var(--ink);outline:none;background:#fffdfa}.search input:focus{border-color:#e99788;box-shadow:0 0 0 4px #e9978825}.search svg{position:absolute;left:14px;top:13px;color:#9b817c}.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 2px 14px;color:var(--muted);font-size:13px}.summary strong{color:var(--ink)}.notice{color:#8a6a22;background:#fff8df;border:1px solid #f3e5aa;border-radius:10px;padding:6px 10px;font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{display:flex;flex-direction:column;min-height:164px;border:1px solid var(--line);border-radius:17px;padding:17px;background:linear-gradient(160deg,#fffdfa,#fff9f6);transition:transform .18s,box-shadow .18s,border-color .18s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 25px #a86f6018;border-color:#f1c8bb}.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.unit{font-size:11px;font-weight:800;letter-spacing:.04em;color:#9b6259;background:#fff0eb;border-radius:99px;padding:5px 9px}.card h2{font-size:16px;line-height:1.55;margin:15px 0 14px;font-weight:750}.card-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.open{display:inline-flex;align-items:center;gap:7px;color:#c36359;text-decoration:none;font-weight:750;font-size:13px}.open:hover{text-decoration:underline}.subject-dot{width:10px;height:10px;border-radius:50%;background:var(--blue)}.subject-dot.國語{background:var(--pink)}.subject-dot.數學{background:var(--blue)}.subject-dot.社會{background:var(--green)}.unavailable{color:#9b7830;font-size:12px;line-height:1.55}.empty{grid-column:1/-1;text-align:center;padding:42px 15px;border:1px dashed #ebd4ca;border-radius:17px;background:#fffaf7;color:var(--muted);line-height:1.8}.empty strong{display:block;color:#765853;font-size:16px;margin-bottom:4px}.footer{text-align:center;padding:24px 10px 10px;color:#927e79;font-size:12px}.footer strong{color:#765853;font-weight:650}
    @media(max-width:850px){.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.spark{right:5%;opacity:.34}.intro{margin-top:32px}}
    @media(max-width:560px){.hero{padding:18px 16px 48px}.brandmark{width:40px;height:52px;flex-basis:40px}.brand{font-size:12px}.intro{margin-top:30px}.intro p{font-size:14px;max-width:82%}.spark{right:0;top:24px;font-size:66px;opacity:.22}main{padding:0 12px 28px}.panel{padding:15px;border-radius:19px}.section-heading{align-items:flex-start;flex-direction:column}.section-heading h2{font-size:19px}.category-grid{gap:8px}.category-card{min-height:76px;padding:10px 9px;gap:8px;border-radius:14px}.category-icon{width:34px;height:34px;flex-basis:34px;border-radius:11px;font-size:17px}.category-name{font-size:13px}.category-note{font-size:10px}.category-count{padding:3px 6px;min-width:21px}.subject-panel{margin-top:17px;padding-top:15px}.subject-list{gap:6px}.subject-button{padding:8px 9px;font-size:12px}.toolbar{align-items:stretch;flex-direction:column}.search{flex:auto;min-width:0}.summary{align-items:flex-start;flex-direction:column;margin:14px 2px}.grid{grid-template-columns:1fr;gap:10px}.card{min-height:138px;padding:15px}.card h2{margin:11px 0}.empty{padding:32px 12px}}
  </style>
</head>
<body>
  <header class="hero">
    <div class="topline">
      <img class="brandmark" src="assets/emily-wave.png" alt="">
      <span class="brand">EMILY AI STUDIO</span>
    </div>
    <div class="intro">
      <div class="eyebrow">教學・班級・生活</div>
      <h1>依起愛學習</h1>
      <p>課堂教學、班級經營與日常所需，一起整理在這裡。</p>
      <span class="spark" aria-hidden="true">✳</span>
    </div>
  </header>
  <main>
    <section class="panel" aria-label="教學與生活工具箱">
      <div class="section-heading">
        <div><p class="kicker">工具分類</p><h2>想找哪一類工具？</h2></div>
        <p>選擇分類，快速找到需要的網頁</p>
      </div>
      <nav class="category-grid" id="categories" aria-label="工具分類"></nav>
      <section class="subject-panel" id="subject-panel" aria-label="年級學科篩選" hidden>
        <div class="subject-heading"><h3 id="subject-title">年級學科</h3><span>依科目縮小範圍</span></div>
        <div class="subject-list" id="subjects" role="group" aria-label="依科目篩選"></div>
      </section>
      <div class="toolbar">
        <span class="toolbar-title" id="list-title">全部工具</span>
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.3 4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="搜尋工具名稱或關鍵字" aria-label="搜尋工具">
        </label>
      </div>
      <div class="summary"><span id="result-text">正在載入工具…</span><span class="notice" id="local-note" hidden></span></div>
      <div class="grid" id="cards" aria-live="polite"></div>
    </section>
    <footer class="footer">設計 by 楊依依老師｜Emily AI Studio</footer>
  </main>
  <script>
    const categories=[
      {id:'全部',name:'全部工具',icon:'✨',note:'瀏覽所有已收錄項目'},
      {id:'三年級',name:'三年級',icon:'📚',note:'國語・數學・社會'},
      {id:'四年級',name:'四年級',icon:'🌱',note:'年級教學資源'},
      {id:'五年級',name:'五年級',icon:'🌼',note:'年級教學資源'},
      {id:'課堂互動與評量',name:'課堂互動與評量',icon:'🎯',note:'遊戲・測驗・即時回饋'},
      {id:'班級經營工具',name:'班級經營工具',icon:'🏫',note:'班務與教室日常'},
      {id:'備課與教材製作',name:'備課與教材製作',icon:'📝',note:'教案・學習單・簡報'},
      {id:'教師行政工具',name:'教師行政工具',icon:'📋',note:'紀錄・整理・行政流程'},
      {id:'學生學習支持',name:'學生學習支持',icon:'🌈',note:'補救・延伸・多元支持'},
      {id:'生活小工具',name:'生活小工具',icon:'☀️',note:'教師生活應用'},
      {id:'聯絡簿',name:'聯絡簿',icon:'📒',note:'每日事項與親師溝通'},
      {id:'其他',name:'其他',icon:'🧰',note:'更多教學與實用資源'}
    ];
    const schoolSubjects=['國語','數學','社會','自然','英語'];
    const state={items:[],category:'全部',subject:'全部',query:''};
    const $=selector=>document.querySelector(selector);
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});
    const isGrade=id=>['三年級','四年級','五年級'].includes(id);
    function renderCategoryButtons(){
      $('#categories').innerHTML=categories.map(function(category){
        const count=category.id==='全部'?state.items.length:state.items.filter(function(item){return item.category===category.id}).length;
        return '<button class="category-card" type="button" data-category="'+escapeHtml(category.id)+'" aria-pressed="'+String(state.category===category.id)+'"><span class="category-icon" aria-hidden="true">'+category.icon+'</span><span class="category-copy"><span class="category-name">'+escapeHtml(category.name)+'</span><span class="category-note">'+escapeHtml(category.note)+'</span></span><span class="category-count">'+count+'</span></button>';
      }).join('');
      document.querySelectorAll('.category-card').forEach(function(button){button.addEventListener('click',function(){state.category=button.dataset.category;state.subject='全部';render()})});
    }
    function renderSubjectButtons(categoryItems){
      const panel=$('#subject-panel');
      panel.hidden=!isGrade(state.category);
      if(panel.hidden)return;
      $('#subject-title').textContent=state.category+'學科';
      const availableSubjects=schoolSubjects.filter(function(subject){return categoryItems.some(function(item){return item.subject===subject})});
      const subjects=['全部'].concat(availableSubjects.length?availableSubjects:schoolSubjects);
      $('#subjects').innerHTML=subjects.map(function(subject){
        const count=subject==='全部'?categoryItems.length:categoryItems.filter(function(item){return item.subject===subject}).length;
        return '<button class="subject-button" type="button" data-subject="'+escapeHtml(subject)+'" aria-pressed="'+String(state.subject===subject)+'"><span>'+escapeHtml(subject)+'</span><span class="subject-count">'+count+'</span></button>';
      }).join('');
      document.querySelectorAll('.subject-button').forEach(function(button){button.addEventListener('click',function(){state.subject=button.dataset.subject;render()})});
    }
    function render(){
      const categoryItems=state.category==='全部'?state.items:state.items.filter(function(item){return item.category===state.category});
      renderCategoryButtons();
      renderSubjectButtons(categoryItems);
      const shown=categoryItems.filter(function(item){
        const subjectMatches=state.subject==='全部'||item.subject===state.subject;
        const searchable=[item.title,item.subject,item.category,item.note].join(' ').toLowerCase();
        return subjectMatches&&searchable.includes(state.query.toLowerCase());
      });
      const category=categories.find(function(item){return item.id===state.category});
      $('#list-title').textContent=category?category.name:'全部工具';
      $('#result-text').innerHTML='目前顯示 <strong>'+shown.length+'</strong> 個項目';
      const local=state.items.filter(function(item){return !item.available}).length;
      const note=$('#local-note');note.hidden=!local;note.textContent=local?local+' 筆項目需要原始檔，暫時無法開啟':'';
      if(shown.length){
        $('#cards').innerHTML=shown.map(function(item){
          const label=item.subject||item.category||'教學工具';
          const destination=item.available?'<a class="open" href="'+escapeHtml(item.url)+'" target="_blank" rel="noopener noreferrer">開啟網頁 <span aria-hidden="true">↗</span></a>':'<span class="unavailable">原始檔未提供，暫時無法開啟</span>';
          return '<article class="card"><div class="card-top"><span class="unit">'+escapeHtml(label)+'</span><span class="subject-dot '+escapeHtml(item.subject||'')+'" aria-hidden="true"></span></div><h2>'+escapeHtml(item.title)+'</h2><div class="card-bottom">'+destination+'</div></article>';
        }).join('');
      }else if(state.query||categoryItems.length){
        $('#cards').innerHTML='<div class="empty"><strong>找不到符合條件的工具</strong>試試其他關鍵字或切換分類。</div>';
      }else{
        $('#cards').innerHTML='<div class="empty"><strong>此分類已建立，工具整理中 🌱</strong>新增相關網頁後，就會顯示在這裡。</div>';
      }
    }
    $('#search').addEventListener('input',function(event){state.query=event.target.value.trim();render()});
    fetch('./resources.json?v=category-structure-v1').then(function(response){if(!response.ok)throw new Error('resources');return response.json()}).then(function(items){state.items=items;render()}).catch(function(){
      $('#result-text').textContent='工具清單載入失敗，請確認 resources.json 與 index.html 位於同一資料夾。';
      $('#cards').innerHTML='<div class="empty"><strong>目前無法載入工具清單</strong>請稍後重新整理頁面。</div>';
    });
  </script>
</body>
</html>
